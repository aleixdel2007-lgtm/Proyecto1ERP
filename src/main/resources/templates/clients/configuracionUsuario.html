<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mi perfil · LudusERP</title>
    <link rel="stylesheet" th:href="@{/css/navbar.css}" href="../../static/css/navbar.css">
    <link rel="stylesheet" th:href="@{/css/configuracionUsuario.css}" href="../../static/css/configuracionUsuario.css">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="canvas">

    <div class="page-head">
        <div>
            <h1>Mi perfil</h1>
            <p>Consulta y actualiza tus datos personales y de contacto.</p>
        </div>
    </div>

    <div class="grid g-1-2">

        <!-- Tarjeta de perfil -->
        <div class="card">
            <div class="card-body stack profile">
                <img class="avatar avatar-lg" style="object-fit:cover"
                     th:src="${imagen != null} ? @{${imagen.rutaImagen}} : @{/img/placeholder.webp}"
                     th:alt="${imagen != null} ? ${imagen.textoAlternativo} : 'Sin foto de perfil'">
                <div>
                    <div class="t-main profile-name"
                         th:text="${usuario.nombre + ' ' + (usuario.apellidos ?: '')}">Lucía Fernández</div>
                    <div class="t-sub" th:text="${usuario.email}">lucia.f@example.com</div>
                </div>
                <div class="row wrap">
                    <span class="badge b-purple" th:text="${usuario.rol}">CLIENTE</span>
                    <span class="badge" th:classappend="${usuario.activo} ? 'b-good' : 'b-mute'"
                          th:text="${usuario.activo ? 'ACTIVO' : 'INACTIVO'}">ACTIVO</span>
                </div>
                <div class="sep"></div>
                <form th:action="@{/user/profile/imagen}" method="post" enctype="multipart/form-data" class="stack">
                    <div class="frow">
                        <label for="imagen">Foto de perfil</label>
                        <div class="file-pick">
                            <input class="file-input" type="file" id="imagen" name="imagen"
                                   accept="image/png,image/jpeg,image/webp" required>
                            <label for="imagen" class="btn">Elegir imagen</label>
                            <span class="hint file-name" id="imagenNombre">Ningún archivo seleccionado</span>
                        </div>
                        <script>
                            document.getElementById("imagen").addEventListener("change", function () {
                                document.getElementById("imagenNombre").textContent =
                                    this.files.length ? this.files[0].name : "Ningún archivo seleccionado";
                            });
                        </script>
                    </div>
                    <div class="frow">
                        <label for="textoAlternativo">Texto alternativo</label>
                        <input class="inp" type="text" id="textoAlternativo" name="textoAlternativo"
                               maxlength="160" placeholder="Describe la imagen"
                               th:value="${imagen?.textoAlternativo}">
                    </div>
                    <span class="hint" th:if="${okImagen}" th:text="${okImagen}"></span>
                    <span class="hint" th:if="${errorImagen}" th:text="${errorImagen}"></span>
                    <button type="submit" class="btn btn-primary">Cambiar foto</button>
                </form>
                <div class="sep"></div>
                <dl class="kv">
                    <dt>Alta</dt>
                    <dd th:text="${#temporals.format(usuario.fechaAlta, 'dd/MM/yyyy')}"></dd>
                </dl>
            </div>
        </div>

        <!-- Datos del usuario -->
        <div class="card">
            <form th:action="@{/user/profile}" method="post">
                <div class="card-head"><h3>Mis datos</h3></div>
                <div class="card-body">
                    <div class="form-grid">

                        <div class="frow wide"><div class="sect-label">Datos personales</div></div>

                        <div class="frow">
                            <label for="nombre">Nombre <span class="req">*</span></label>
                            <input class="inp" type="text" id="nombre" name="nombre" autocomplete="given-name"
                                   th:value="${usuario.nombre}" required>
                        </div>

                        <div class="frow">
                            <label for="apellidos">Apellidos</label>
                            <input class="inp" type="text" id="apellidos" name="apellidos" autocomplete="family-name"
                                   th:value="${usuario.apellidos}">
                        </div>

                        <div class="frow wide">
                            <label for="email">Correo electrónico</label>
                            <input class="inp" type="email" id="email" name="email"
                                   th:value="${usuario.email}" readonly>
                            <span class="hint">Es tu identificador de acceso y no se puede cambiar.</span>
                        </div>

                        <!-- Estos campos son de la tabla cliente, no de usuario: un empleado o un
                             colaborador no los tiene, y antes se les pintaban vacios. Sus datos de
                             empresa los lleva el administrador desde el panel. -->
                        <th:block th:if="${cliente != null}">

                            <div class="frow">
                                <label for="fechaNacimiento">Fecha de nacimiento</label>
                                <input class="inp" type="date" id="fechaNacimiento" name="fechaNacimiento"
                                       th:value="${cliente.fechaNacimiento}">
                            </div>

                            <div class="frow">
                                <label for="pais">País</label>
                                <input class="inp" type="text" id="pais" name="pais" autocomplete="country-name"
                                       th:value="${cliente.pais}">
                            </div>

                            <div class="frow wide"><div class="sect-label">Datos de contacto</div></div>

                            <div class="frow">
                                <label for="telefono">Teléfono</label>
                                <input class="inp" type="tel" id="telefono" name="telefono" autocomplete="tel"
                                       th:value="${cliente.telefono}">
                            </div>

                            <div class="frow">
                                <label for="ciudad">Ciudad</label>
                                <input class="inp" type="text" id="ciudad" name="ciudad" autocomplete="address-level2"
                                       th:value="${cliente.ciudad}">
                            </div>

                            <div class="frow wide">
                                <label for="direccion">Dirección</label>
                                <input class="inp" type="text" id="direccion" name="direccion" autocomplete="street-address"
                                       th:value="${cliente.direccion}">
                            </div>

                        </th:block>

                    </div>
                </div>
                <div class="form-foot">
                    <span class="note" th:if="${okDatos}" th:text="${okDatos}"></span>
                    <span class="note" th:if="${errorDatos}" th:text="${errorDatos}"></span>
                    <!-- A donde se vuelve depende del rol: un cliente o un colaborador no
                         pueden entrar en /home, asi que ese boton les daba un 403. -->
                    <a class="btn" sec:authorize="hasAnyRole('CLIENTE','COLABORADOR')"
                       th:href="@{/tienda}" href="#">Cancelar</a>
                    <a class="btn" sec:authorize="!hasAnyRole('CLIENTE','COLABORADOR')"
                       th:href="@{/home}" href="#">Cancelar</a>
                    <button type="submit" class="btn btn-primary">Guardar</button>
                </div>
            </form>
        </div>

    </div>
</main>

</body>
</html>
