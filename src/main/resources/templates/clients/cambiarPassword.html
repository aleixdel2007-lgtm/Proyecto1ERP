<!doctype html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title th:text="#{password.titulo} + ' · LudusERP'">Cambiar contraseña · LudusERP</title>
        <link rel="stylesheet" th:href="@{/css/login.css}" href="../static/css/login.css">
    </head>
    <body>

        <main class="auth">
            <select th:replace="~{fragments/idioma :: selector}"></select>
            <div class="auth-box">

                <div class="auth-brand">
                    <div class="brand-mark">L</div>
                    <div class="brand-name">Ludus<span>ERP</span></div>
                </div>

                <div class="card">
                    <form class="card-body stack" th:action="@{/user/changePassword}" method="post"
                          th:data-msg-corta="#{password.error.corta}"
                          th:data-msg-igual="#{password.error.igual}"
                          th:data-msg-mayuscula="#{password.error.mayuscula}"
                          th:data-msg-simbolo="#{password.error.simbolo}"
                          th:data-msg-no-coincide="#{password.error.noCoincide}">

                        <div>
                            <div class="pass-icon" aria-hidden="true">
                                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
                                     stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="4" y="11" width="16" height="10" rx="2"/>
                                <path d="M8 11V7a4 4 0 0 1 8 0v4"/>
                                </svg>
                            </div>
                            <h2 class="auth-title" th:text="#{password.titulo}">Cambiar contraseña</h2>
                            <p class="hint auth-sub" th:text="#{password.intro}">Introduce tu contraseña actual y elige una nueva.</p>
                        </div>

                        <!-- Mensajes -->
                        <div class="alert alert-err" th:if="${error}" th:text="${error}"></div>

                        <!-- Contraseña actual -->
                        <div class="frow">
                            <label for="passwordActual"><th:block th:text="#{password.actual}">Contraseña actual</th:block> <span class="req">*</span></label>
                            <div class="inp-pass">
                                <input class="inp" type="password" id="passwordActual" name="passwordActual"
                                       autocomplete="current-password" required autofocus>
                                <button type="button" class="pass-toggle" data-toggle-pass="passwordActual"
                                        th:aria-label="#{password.mostrar}" aria-label="Mostrar contraseña" aria-pressed="false">
                                    <svg class="ico-show" viewBox="0 0 24 24" width="18" height="18" fill="none"
                                         stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/>
                                    <circle cx="12" cy="12" r="3"/>
                                    </svg>
                                    <svg class="ico-hide" viewBox="0 0 24 24" width="18" height="18" fill="none"
                                         stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M17.94 17.94A10.4 10.4 0 0 1 12 19c-6.5 0-10-7-10-7a18.5 18.5 0 0 1 5.06-5.94"/>
                                    <path d="M9.9 4.24A9.1 9.1 0 0 1 12 4c6.5 0 10 7 10 7a18.6 18.6 0 0 1-2.16 3.19"/>
                                    <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/>
                                    <line x1="2" y1="2" x2="22" y2="22"/>
                                    </svg>
                                </button>
                            </div>
                        </div>

                        <div class="sep"></div>

                        <!-- Nueva contraseña -->
                        <div class="frow">
                            <label for="nuevaPassword"><th:block th:text="#{password.nueva}">Nueva contraseña</th:block> <span class="req">*</span></label>
                            <div class="inp-pass">
                                <input class="inp" type="password" id="nuevaPassword" name="nuevaPassword"
                                       autocomplete="new-password" minlength="8" required>
                                <button type="button" class="pass-toggle" data-toggle-pass="nuevaPassword"
                                        th:aria-label="#{password.mostrar}" aria-label="Mostrar contraseña" aria-pressed="false">
                                    <svg class="ico-show" viewBox="0 0 24 24" width="18" height="18" fill="none"
                                         stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/>
                                    <circle cx="12" cy="12" r="3"/>
                                    </svg>
                                    <svg class="ico-hide" viewBox="0 0 24 24" width="18" height="18" fill="none"
                                         stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M17.94 17.94A10.4 10.4 0 0 1 12 19c-6.5 0-10-7-10-7a18.5 18.5 0 0 1 5.06-5.94"/>
                                    <path d="M9.9 4.24A9.1 9.1 0 0 1 12 4c6.5 0 10 7 10 7a18.6 18.6 0 0 1-2.16 3.19"/>
                                    <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/>
                                    <line x1="2" y1="2" x2="22" y2="22"/>
                                    </svg>
                                </button>
                            </div>
                        </div>

                        <!-- Repetir nueva contraseña -->
                        <div class="frow">
                            <label for="repetirPassword"><th:block th:text="#{password.repetir}">Repite la nueva contraseña</th:block> <span class="req">*</span></label>
                            <div class="inp-pass">
                                <input class="inp" type="password" id="repetirPassword" name="repetirPassword"
                                       autocomplete="new-password" minlength="8" required>
                                <button type="button" class="pass-toggle" data-toggle-pass="repetirPassword"
                                        th:aria-label="#{password.mostrar}" aria-label="Mostrar contraseña" aria-pressed="false">
                                    <svg class="ico-show" viewBox="0 0 24 24" width="18" height="18" fill="none"
                                         stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/>
                                    <circle cx="12" cy="12" r="3"/>
                                    </svg>
                                    <svg class="ico-hide" viewBox="0 0 24 24" width="18" height="18" fill="none"
                                         stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M17.94 17.94A10.4 10.4 0 0 1 12 19c-6.5 0-10-7-10-7a18.5 18.5 0 0 1 5.06-5.94"/>
                                    <path d="M9.9 4.24A9.1 9.1 0 0 1 12 4c6.5 0 10 7 10 7a18.6 18.6 0 0 1-2.16 3.19"/>
                                    <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/>
                                    <line x1="2" y1="2" x2="22" y2="22"/>
                                    </svg>
                                </button>
                            </div>
                        </div>

                        <!-- Requisitos: cambiarPassword.js los marca en verde al cumplirse -->
                        <ul class="pass-rules" aria-live="polite">
                            <li data-regla="min" th:text="#{password.regla.min}">Mínimo 8 caracteres</li>
                            <li data-regla="distinta" th:text="#{password.regla.distinta}">Distinta de la contraseña actual</li>
                            <li data-regla="mayuscula" th:text="#{password.regla.mayuscula}">Al menos una letra mayúscula</li>
                            <li data-regla="simbolo" th:text="#{password.regla.simbolo}">Al menos un símbolo especial (por ejemplo ! @ # $ %)</li>
                        </ul>

                        <button type="submit" class="btn btn-primary btn-block" th:text="#{password.guardar}">Guardar contraseña</button>

                        <div class="sep"></div>

                        <p class="hint auth-foot">
                            <a th:href="@{/}" href="#" th:text="#{password.volver}">Volver</a>
                        </p>
                    </form>
                </div>

            </div>
        </main>

        <script th:src="@{/js/password.js}" src="../static/js/password.js"></script>
        <script th:src="@{/js/cambiarPassword.js}" src="../static/js/cambiarPassword.js"></script>
    </body>
</html>
