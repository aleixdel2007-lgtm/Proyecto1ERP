<!doctype html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="#{plataformas.editar} + ' · LudusERP'">Editar plataforma · LudusERP</title>
    <link rel="stylesheet" th:href="@{/css/panel.css}">
    <link rel="stylesheet" th:href="@{/css/catalogo.css}">
</head>
<body>

<div class="app">

    <aside th:replace="~{fragments/panel :: menu('plataformas')}"></aside>

    <div class="main">

        <header th:replace="~{fragments/panel :: barra(#{panel.seccion.catalogo}, #{panel.menu.plataformas})}"></header>

        <main class="canvas">

            <a class="btn btn-ghost btn-sm" th:href="@{/catalogo/plataformas}">
                <svg th:replace="~{fragments/iconos :: back}"></svg> <span th:text="#{comun.volverListado}">Volver al listado</span></a>

            <div class="page-head">
                <div>
                    <h1 th:text="#{plataformas.editar}">Editar plataforma</h1>
                </div>
            </div>

            <div class="alert alert-err" th:if="${error}" th:text="${error}"></div>

            <div class="grid g-2-1">

                <div class="card">
                    <form th:action="@{/catalogo/plataformas/guardar}" method="post" th:object="${plataforma}">

                        <input type="hidden" th:field="*{id}">

                        <div class="card-body">
                            <div class="form-grid">

                                <div class="frow">
                                    <label for="nombre"><span th:text="#{comun.nombre}">Nombre</span> <span class="req">*</span></label>
                                    <input class="inp" type="text" th:field="*{nombre}" maxlength="60"
                                           placeholder="PlayStation 5" required>
                                    <span class="hint" th:text="#{plataformas.hint.nombre}">Es lo que se ve en la tienda. Único en la tabla.</span>
                                </div>

                                <div class="frow">
                                    <label for="codigo"><span th:text="#{comun.codigo}">Código</span> <span class="req">*</span></label>
                                    <input class="inp" type="text" th:field="*{codigo}" maxlength="20"
                                           placeholder="PS5" required>
                                    <span class="hint" th:text="#{plataformas.hint.codigo}">Identificador corto.</span>
                                </div>

                            </div>
                        </div>

                        <div class="form-foot">
                            <span class="note" th:text="#{plataformas.nota.editar}">Cambiar el nombre no afecta a los juegos que ya la tienen.</span>
                            <a class="btn" th:href="@{/catalogo/plataformas}" th:text="#{comun.cancelar}">Cancelar</a>
                            <button type="submit" class="btn btn-primary" th:text="#{comun.guardarCambios}">Guardar cambios</button>
                        </div>

                    </form>
                </div>

                <div class="stack">

                    <div class="card">
                        <div class="card-head"><h3 th:text="#{plataformas.uso}">Uso en el catálogo</h3></div>
                        <div class="card-body">
                            <dl class="kv">
                                <dt th:text="#{plataformas.juegosAsignados}">Juegos asignados</dt>
                                <dd th:text="${juegosAsignados}">0</dd>
                            </dl>
                        </div>
                    </div>

                    <div class="note-box">
                        <svg th:replace="~{fragments/iconos :: warn}"></svg>
                        <div th:text="#{plataformas.aviso.editar}">Mientras tenga juegos asignados no se puede eliminar.</div>
                    </div>

                </div>

            </div>

        </main>
    </div>
</div>

</body>
</html>
