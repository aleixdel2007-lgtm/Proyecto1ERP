<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>

<aside class="side" th:fragment="menu(activo)">
    <div class="brand">
        <div class="brand-mark">L</div>
        <div class="brand-name">Ludus<span>ERP</span></div>
    </div>
    <div class="side-scroll">
        <div class="nav-group">Panel</div>
        <a class="nav-item" th:classappend="${activo == 'inicio'} ? 'on' : ''"
           th:href="@{/home}">
            <span class="ic"><svg th:replace="~{fragments/iconos :: panel}"></svg></span>Panel de control</a>

        <th:block sec:authorize="hasAnyRole('GESTOR_PRODUCTOS', 'ADMIN')">
            <div class="nav-group">Catálogo</div>
            <a class="nav-item" th:classappend="${activo == 'videojuegos'} ? 'on' : ''"
               th:href="@{/catalogo/videojuegos}">
                <span class="ic"><svg th:replace="~{fragments/iconos :: game}"></svg></span>Videojuegos</a>
            <a class="nav-item" th:classappend="${activo == 'categorias'} ? 'on' : ''"
               th:href="@{/catalogo/categorias}">
                <span class="ic"><svg th:replace="~{fragments/iconos :: tag}"></svg></span>Categorías</a>
            <a class="nav-item" th:classappend="${activo == 'plataformas'} ? 'on' : ''"
               th:href="@{/catalogo/plataformas}">
                <span class="ic"><svg th:replace="~{fragments/iconos :: monitor}"></svg></span>Plataformas</a>
        </th:block>

        <th:block sec:authorize="hasAnyRole('ADMIN', 'GESTOR_INVENTARIO')">
        <div class="nav-group">Aprovisionamiento</div>
        <a class="nav-item" th:classappend="${activo == 'proveedores'} ? 'on' : ''"
           th:href="@{/compras/proveedores}">
            
            <span class="ic"><svg th:replace="~{fragments/iconos :: truck}"></svg></span>Proveedores</a>
        <a class="nav-item" th:classappend="${activo == 'claves'} ? 'on' : ''"
           th:href="@{/inventario/claves}">
            <span class="ic"><svg th:replace="~{fragments/iconos :: key}"></svg></span>Claves de licencia</a>
        </th:block>
        <th:block sec:authorize="hasAnyRole('ADMIN', 'GESTOR_INVENTARIO')">
            <div class="nav-group">Ventas</div>
            <a class="nav-item" th:classappend="${activo == 'pedidos'} ? 'on' : ''"
               th:href="@{/ventas/pedidos}">
                <span class="ic"><svg th:replace="~{fragments/iconos :: cart}"></svg></span>Pedidos</a>
            <a class="nav-item" th:classappend="${activo == 'facturas'} ? 'on' : ''"
               th:href="@{/ventas/facturas}">
                <span class="ic"><svg th:replace="~{fragments/iconos :: receipt}"></svg></span>Facturas</a>
        </th:block>
        <th:block sec:authorize="hasAnyRole('GESTOR_CLIENTES', 'ADMIN')">
            <div class="nav-group">Clientes</div>
            <a class="nav-item" th:classappend="${activo == 'clientes'} ? 'on' : ''"
               th:href="@{/clientes}">
                <span class="ic"><svg th:replace="~{fragments/iconos :: users}"></svg></span>Clientes</a>
        </th:block>
        
        <th:block sec:authorize="hasRole('ADMIN')">
            <div class="nav-group">Administración</div>
            <a class="nav-item" th:classappend="${activo == 'empleados'} ? 'on' : ''"
               th:href="@{/empleados}">
                <span class="ic"><svg th:replace="~{fragments/iconos :: badge2}"></svg></span>Empleados</a>
            <a class="nav-item" th:classappend="${activo == 'departamentos'} ? 'on' : ''"
               th:href="@{/departamentos}">
                <span class="ic"><svg th:replace="~{fragments/iconos :: dept}"></svg></span>Departamentos</a>
            <a class="nav-item" th:classappend="${activo == 'colaboradores'} ? 'on' : ''"
               th:href="@{/admin/colaboradores}">
                <span class="ic"><svg th:replace="~{fragments/iconos :: users}"></svg></span>Colaboradores</a>
        </th:block>
    </div>

    <div class="side-foot">
        <form th:action="@{/logout}" method="post">
            <button type="submit" class="btn btn-ghost btn-block">Cerrar sesión</button>
        </form>
    </div>
</aside>

<header class="top" th:fragment="barra(seccion, titulo)">
    <div class="crumb">
        <span th:text="${seccion}">Aprovisionamiento</span>
        <span>/</span>
        <b th:text="${titulo}">Proveedores</b>
    </div>
    <select class="lang" title="Idioma de la interfaz" th:title="#{navbar.idioma}"
            onchange="const u=new window.URL(window.location.href);u.searchParams.set('lang',this.value);window.location.href=u.href;">
        <option value="es" th:selected="${#locale.language == 'es'}">ES</option>
        <option value="ca" th:selected="${#locale.language == 'ca'}">CA</option>
        <option value="en" th:selected="${#locale.language == 'en'}">EN</option>
    </select>
    <div class="who">
        <img class="avatar" style="object-fit:cover"
             th:src="${imagenPerfil != null} ? @{${imagenPerfil.rutaImagen}} : @{/img/placeholder.webp}"
             th:alt="${imagenPerfil != null} ? ${imagenPerfil.textoAlternativo} : 'Sin foto de perfil'">
        <div class="who-txt"
             th:with="rol=${#strings.replace(#authentication.authorities[0].authority, 'ROLE_', '')}">
            <b sec:authentication="name">usuario@luduserp.cat</b>
            <span class="badge" th:classappend="${'b-rol-' + #strings.toLowerCase(rol)}"
                  th:text="${rol}">ADMIN</span>
        </div>
    </div>
</header>

</body>
</html>
