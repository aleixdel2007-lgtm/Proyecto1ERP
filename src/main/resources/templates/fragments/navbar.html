<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>

<header class="top" th:fragment="navbar">
    <a class="top-brand" th:href="@{/home}" href="#">
        <div class="brand-mark">L</div>
        <div class="brand-name">Ludus<span>ERP</span></div>
    </a>

        <select class="lang" title="Idioma de la interfaz" th:title="#{navbar.idioma}"
                onchange="const u=new window.URL(window.location.href);u.searchParams.set('lang',this.value);window.location.href=u.href;">
            <option value="es" th:selected="${#locale.language == 'es'}">ES</option>
            <option value="ca" th:selected="${#locale.language == 'ca'}">CA</option>
            <option value="en" th:selected="${#locale.language == 'en'}">EN</option>
        </select>
    <div class="who">
        <!-- Sin foto va el avatar generico de /img/placeholder.webp. No hay fila de
             imagen_usuario para esos: el hueco lo rellena la plantilla. -->
        <img class="avatar" style="object-fit:cover"
             th:src="${imagenPerfil != null} ? @{${imagenPerfil.rutaImagen}} : @{/img/placeholder.webp}"
             th:alt="${imagenPerfil != null} ? ${imagenPerfil.textoAlternativo} : #{navbar.sinFoto}">

        <!-- El rol va como distintivo de color, el mismo que el del listado de empleados.
             Se le quita el prefijo ROLE_ que pone Security: lo que se ensena es el valor
             del enum, igual que en el panel. -->
        <div class="who-txt"
             th:with="rol=${#strings.replace(#authentication.authorities[0].authority, 'ROLE_', '')}">
            <b th:text="${#authentication.name}">admin@luduserp.cat</b>
            <span class="badge" th:classappend="${'b-rol-' + #strings.toLowerCase(rol)}"
                  th:text="${rol}">ADMIN</span>
        </div>
    </div>

    <!-- Salir pregunta antes. El POST vive dentro del pop-up (Security 6 solo escucha POST
         y el token CSRF lo pone Thymeleaf); este boton solo lo abre. -->
    <button type="button" class="top-logout" th:text="#{navbar.cerrarSesion}"
            onclick="document.getElementById('dlg-salir').showModal()">Cerrar sesión</button>
    <th:block th:replace="~{fragments/dialogos :: confirmarSalida}"></th:block>
    <script th:src="@{/js/client-profile.js}" src="../static/js/client-profile.js"></script>
</header>

<!-- La barra de la tienda. No es la de arriba: aqui la marca lleva al catalogo y no al
     panel y no hay buscador (el filtro vive dentro de la propia pagina). El parametro
     activo marca en que apartado estas, y vale catalogo, ofertas, colaboraciones,
     biblioteca o misJuegos. Colaboraciones la ve todo el mundo; Mi biblioteca es de quien
     compra, o sea del cliente, y Mis juegos, solo del colaborador. -->
<header class="shop-top" th:fragment="barraTienda(activo)">
    <div class="shop-bar">

        <a class="top-brand" th:href="@{/tienda}" href="#">
            <div class="brand-mark">L</div>
            <div class="brand-name">Ludus<span>ERP</span></div>
        </a>

        <nav class="shop-nav">
            <a th:href="@{/tienda}" href="#"
               th:classappend="${activo == 'catalogo'} ? 'on' : ''" th:text="#{navbar.catalogo}">Catálogo</a>
            <a th:href="@{/tienda/ofertas}" href="#"
               th:classappend="${activo == 'ofertas'} ? 'on' : ''" th:text="#{navbar.ofertas}">Ofertas</a>
            <a th:href="@{/tienda/colaboraciones}" href="#"
               th:classappend="${activo == 'colaboraciones'} ? 'on' : ''" th:text="#{navbar.colaboraciones}">Colaboraciones</a>
            <th:block sec:authorize="hasRole('CLIENTE')">
                <a th:href="@{/tienda/biblioteca}" href="#"
                   th:classappend="${activo == 'biblioteca'} ? 'on' : ''" th:text="#{navbar.biblioteca}">Mi biblioteca</a>
            </th:block>
            <th:block sec:authorize="hasRole('COLABORADOR')">
                <a th:href="@{/colaborador/mis-juegos}" href="#"
                   th:classappend="${activo == 'misJuegos'} ? 'on' : ''" th:text="#{navbar.misJuegos}">Mis juegos</a>
            </th:block>
        </nav>

        <select class="lang" title="Idioma de la interfaz" th:title="#{navbar.idioma}"
                onchange="const u=new window.URL(window.location.href);u.searchParams.set('lang',this.value);window.location.href=u.href;">
            <option value="es" th:selected="${#locale.language == 'es'}">ES</option>
            <option value="ca" th:selected="${#locale.language == 'ca'}">CA</option>
            <option value="en" th:selected="${#locale.language == 'en'}">EN</option>
        </select>

        <!-- La cesta va aqui y no en el menu: es una accion del cliente, como el idioma o
             su foto, y no un apartado mas de la tienda. Solo el icono, con el title y el
             aria-label traducidos para que se sepa que es sin leer la palabra -->
        <a class="cart-link" sec:authorize="hasRole('CLIENTE')" th:href="@{/tienda/cesta}"
           th:classappend="${activo == 'cesta'} ? 'on' : ''"
           title="Mi cesta" th:title="#{cesta.titulo}" th:aria-label="#{cesta.titulo}">
            <svg th:replace="~{fragments/iconos :: cart}"></svg>
        </a>

        <div class="who">
            <img class="avatar" style="object-fit:cover"
                 th:src="${imagenPerfil != null} ? @{${imagenPerfil.rutaImagen}} : @{/img/placeholder.webp}"
                 th:alt="${imagenPerfil != null} ? ${imagenPerfil.textoAlternativo} : #{navbar.sinFoto}">

            <div class="who-txt"
                 th:with="rol=${#strings.replace(#authentication.authorities[0].authority, 'ROLE_', '')}">
                <b th:text="${#authentication.name}">cliente@example.com</b>
                <span class="badge" th:classappend="${'b-rol-' + #strings.toLowerCase(rol)}"
                      th:text="${rol}">CLIENTE</span>
            </div>
        </div>

        <!-- Al admin tambien lo manda aqui el successHandler, asi que necesita una puerta
             de vuelta al panel. El cliente y el colaborador no ven este boton. -->
        <a class="btn" sec:authorize="hasRole('ADMIN')" th:href="@{/home}" href="#" th:text="#{navbar.panelErp}">Panel ERP</a>

        <button type="button" class="top-logout" th:text="#{navbar.cerrarSesion}"
                onclick="document.getElementById('dlg-salir').showModal()">Cerrar sesión</button>
        <th:block th:replace="~{fragments/dialogos :: confirmarSalida}"></th:block>

    </div>
    <script th:src="@{/js/client-profile.js}" src="../static/js/client-profile.js"></script>
</header>
</body>
</html>
