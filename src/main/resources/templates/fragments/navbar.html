<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>

<header class="top" th:fragment="navbar">
    <a class="top-brand" th:href="@{/home}" href="#">
        <div class="brand-mark">L</div>
        <div class="brand-name">Ludus<span>ERP</span></div>
    </a>
    <th:block sec:authorize="!hasRole('ADMIN')">
        <div class="top-search">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/>
            </svg>
            <input placeholder="Buscar en todo el catalogo...">
        </div>

        <select class="lang" title="Idioma de la interfaz">
            <option>ES</option>
            <option>CA</option>
            <option>EN</option>
        </select>
    </th:block>
    <div class="who">
        <!-- Sin foto va el avatar generico de /img/placeholder.webp. No hay fila de
             imagen_usuario para esos: el hueco lo rellena la plantilla. -->
        <img class="avatar" style="object-fit:cover"
             th:src="${imagenPerfil != null} ? @{${imagenPerfil.rutaImagen}} : @{/img/placeholder.webp}"
             th:alt="${imagenPerfil != null} ? ${imagenPerfil.textoAlternativo} : 'Sin foto de perfil'">

        <div class="who-txt">
            <b th:text="${#authentication.name}">admin@luduserp.cat</b>
            <span th:text="${#authentication.authorities[0].authority}">ROLE_ADMIN</span>
        </div>
    </div>

    <!-- Tiene que ser un POST: desde Security 6 el filtro de logout solo escucha POST, y un
         enlace GET dejaba la sesion abierta. El token CSRF lo pone Thymeleaf solo. -->
    <form th:action="@{/logout}" method="post">
        <button type="submit" class="top-logout">Cerrar sesión</button>
    </form>
    <script th:src="@{/js/client-profile.js}" src="../static/js/client-profile.js"></script>
</header>
</body>
</html>
