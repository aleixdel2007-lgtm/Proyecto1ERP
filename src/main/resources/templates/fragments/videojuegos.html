<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>

<!-- Las filas del listado de videojuegos del panel. Viven aqui y no dentro de la pantalla
     porque esa tiene DOS tablas, la de nuestro catalogo y la de los juegos de colaborador,
     y las dos pintan la fila igual: tenerla dos veces era la forma segura de que un dia una
     se quedara atras. Recibe el trozo de lista que toca pintar y el mapa de portadas. -->
<tbody th:fragment="filas(juegos, portadas)">
<tr th:each="v : ${juegos}">
    <td>
        <!-- La portada sale del mapa portadas, con la misma forma que el mapa
             juegos del listado de categorias: la clave es el id del juego. -->
        <div class="row">
            <span class="mini" th:if="${portadas[v.id] != null}">
                <img th:src="@{${portadas[v.id]}}" th:alt="${v.titulo}">
            </span>
            <span class="mini vacia" th:if="${portadas[v.id] == null}"
                  title="Este juego todavía no tiene portada">
                <svg th:replace="~{fragments/iconos :: image}"></svg>
            </span>
            <div>
                <div class="t-main" th:text="${v.titulo}">Eclipse Protocol</div>
                <div class="t-sub">
                    <span th:text="'#' + ${v.id}">#318</span>
                    <span th:if="${v.fechaLanzamiento != null}"
                          th:text="' · ' + ${#temporals.format(v.fechaLanzamiento, 'dd/MM/yyyy')}">
                        · 14/03/2026</span>
                </div>
            </div>
        </div>
    </td>
    <td>
        <span th:if="${v.proveedor != null}"
              th:text="${v.proveedor.nombreComercial}">Iberia Digital Supply</span>
        <div th:if="${v.proveedor == null and v.colaborador != null}">
            <div th:text="${v.colaborador.apellidos != null
                    ? v.colaborador.nombre + ' ' + v.colaborador.apellidos
                    : v.colaborador.nombre}">Jordi Bastida</div>
            <div class="t-sub">colaborador</div>
        </div>
        <span class="muted"
              th:if="${v.proveedor == null and v.colaborador == null}">—</span>
    </td>
    <td>
        <span class="chip" th:each="c : ${v.categorias}" th:text="${c.nombre}">RPG</span>
        <span class="muted" th:if="${v.categorias.isEmpty()}">—</span>
    </td>
    <td>
        <span class="chip" th:each="p : ${v.plataformas}" th:text="${p.nombre}">PC</span>
        <span class="muted" th:if="${v.plataformas.isEmpty()}">—</span>
    </td>
    <td class="num" th:text="${v.pegi}">16</td>
    <td class="num">
        <b th:text="${#numbers.formatDecimal(
                v.precioDescuento != null ? v.precioDescuento : v.precio,
                1, 'POINT', 2, 'COMMA')} + ' €'">44,99 €</b>
        <div class="t-sub" th:if="${v.precioDescuento != null}"
             th:text="'estándar ' + ${#numbers.formatDecimal(v.precio, 1, 'POINT', 2, 'COMMA')} + ' €'">
            estándar 59,99 €</div>
    </td>
    <td class="num">
        <span class="muted" title="Pendiente de las claves de licencia">—</span>
    </td>
    <td>
        <span class="badge" th:classappend="${v.activo} ? 'b-good' : 'b-mute'"
              th:text="${v.activo} ? 'ACTIVO' : 'INACTIVO'">ACTIVO</span>
        <!-- El amarillo solo en los juegos de colaborador que esperan a que alguien los
             mire: los acaban de subir o los han vuelto a editar, y en los dos casos el
             servicio los deja inactivos con pendiente_revision a true. Lo que lo distingue
             de uno que el gestor retiro a proposito es ese dato, y no fecha_publicacion,
             que se sella la primera vez que se publica y ya no vuelve a cambiar. Un juego
             nuestro inactivo no esta pendiente de nada, es un borrador. -->
        <span class="badge b-warn"
              th:if="${v.colaborador != null and v.pendienteRevision}"
              title="Lo subió un colaborador y está esperando a que se publique">Pendiente de activación</span>
    </td>
    <td class="acts">
        <a class="btn btn-sm btn-ghost" title="Editar"
           th:href="@{/catalogo/videojuegos/editar/{id}(id=${v.id})}">
            <svg th:replace="~{fragments/iconos :: edit}"></svg>
        </a>
        <!-- Vista previa de como queda la ficha para el cliente. En
             pestana nueva para no perder los filtros ni la pagina. -->
        <a class="btn btn-sm btn-ghost" title="Ver como lo verá el cliente"
           target="_blank"
           th:href="@{/catalogo/videojuegos/{id}/vista-previa(id=${v.id})}">
            <svg th:replace="~{fragments/iconos :: eye}"></svg>
        </a>
        <form th:action="@{/catalogo/videojuegos/eliminar/{id}(id=${v.id})}" method="post"
              onsubmit="return confirm(&quot;¿Seguro que quieres eliminar este videojuego? No se puede deshacer.&quot;);">
            <button type="submit" class="btn btn-sm btn-danger" title="Eliminar">
                <svg th:replace="~{fragments/iconos :: trash}"></svg>
            </button>
        </form>
    </td>
</tr>
</tbody>

</body>
</html>
