<html lang="es" xmlns:th="http://www.thymeleaf.org">
    <head>
        <title>TODO supply a title</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>
    <body>
        <h1>Modificar departamento</h1>

        <form th:action="@{/departamentos/guardar}"
              th:object="${departamento}"
              method="post">

            <input type="hidden" th:field="*{id}">

            <label>Nombre:</label>
            <input type="text" th:field="*{nombre}" maxlength="80" required>
            <br><br>

            <label>Descripción:</label>
            <input type="text" th:field="*{descripcion}" maxlength="255">
            <br><br>

            <label>Responsable:</label>
            <select name="responsableId">
                <option value="">Sin responsable</option>

                <option th:each="trabajador : ${trabajadores}"
                        th:value="${trabajador.id}"
                        th:text="${trabajador.nombre}"
                        th:selected="${departamento.responsable != null and departamento.responsable.id == trabajador.id}">
                </option>
            </select>
            <br><br>

            <button type="submit">Guardar cambios</button>

            <a th:href="@{/departamentos}">Cancelar</a>

        </form>

    </body>
</html>
