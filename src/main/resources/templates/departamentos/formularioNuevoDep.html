<!doctype html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="#{departamentos.nuevo} + ' · LudusERP'">Nuevo departamento · LudusERP</title>
    <link rel="stylesheet" th:href="@{/css/panel.css}">
    <link rel="stylesheet" th:href="@{/css/departamentos.css}">
</head>
<body>

<div class="app">

    <aside th:replace="~{fragments/panel :: menu('departamentos')}"></aside>

    <div class="main">

        <header th:replace="~{fragments/panel :: barra(#{panel.seccion.admin}, #{panel.menu.departamentos})}"></header>

        <main class="canvas">

            <a class="btn btn-ghost btn-sm" th:href="@{/departamentos}">
                <svg th:replace="~{fragments/iconos :: back}"></svg> Volver al listado</a>

            <div class="page-head">
                <div>
                    <h1 th:text="#{departamentos.nuevo}">Nuevo departamento</h1>
                </div>
            </div>

            <div class="alert alert-err" th:if="${error}" th:text="${error}"></div>

            <div class="grid g-2-1">

                <div class="card">
                    <form th:action="@{/departamentos/guardar}" method="post" th:object="${departamento}">

                        <div class="card-body">
                            <div class="form-grid">

                                <div class="frow">
                                    <label for="nombre"><span th:text="#{comun.nombre}">Nombre</span> <span class="req">*</span></label>
                                    <input class="inp" type="text" th:field="*{nombre}" maxlength="80"
                                           th:placeholder="#{departamentos.nombrePh}" placeholder="Marketing" required>
                                    <span class="hint" th:text="#{departamentos.hint.nombre}">Único en la tabla.</span>
                                </div>

                                <div class="frow">
                                    <label for="responsableId" th:text="#{departamentos.col.responsable}">Responsable</label>
                                    <select class="inp" name="responsableId">
                                        <option value="" th:text="#{comun.sinAsignar}">Sin asignar</option>
                                        <option th:each="trabajador : ${trabajadores}"
                                                th:value="${trabajador.id}"
                                                th:text="${trabajador.nombre} + ' ' + ${trabajador.apellidos}">
                                            Aleix Delgado</option>
                                    </select>
                                    <span class="hint" th:text="#{departamentos.hint.responsable}">Se puede dejar sin asignar.</span>
                                </div>

                                <div class="frow wide">
                                    <label for="descripcion" th:text="#{comun.descripcion}">Descripción</label>
                                    <input class="inp" type="text" th:field="*{descripcion}" maxlength="255"
                                           th:placeholder="#{departamentos.descripcionPh}" placeholder="Qué se hace en este departamento">
                                </div>

                            </div>
                        </div>

                        <div class="form-foot">
                            <span class="note" th:text="#{departamentos.nota.borrar}">Un departamento con trabajadores dentro ya no se podrá borrar.</span>
                            <a class="btn" th:href="@{/departamentos}" th:text="#{comun.cancelar}">Cancelar</a>
                            <button type="submit" class="btn btn-primary" th:text="#{departamentos.crear}">Crear departamento</button>
                        </div>

                    </form>
                </div>

                <div class="stack">
                    <div class="note-box">
                        <svg th:replace="~{fragments/iconos :: warn}"></svg>
                        <div th:text="#{departamentos.aviso.responsable}">El responsable solo puede dirigir un departamento.</div>
                    </div>
                </div>

            </div>

        </main>
    </div>
</div>

</body>
</html>
