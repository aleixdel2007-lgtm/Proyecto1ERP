<!doctype html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="#{panel.menu.proveedores} + ' · LudusERP'">Proveedores · LudusERP</title>
    <link rel="stylesheet" th:href="@{/css/panel.css}">
</head>
<body>

<div class="app">

    <aside th:replace="~{fragments/panel :: menu('proveedores')}"></aside>

    <div class="main">

        <header th:replace="~{fragments/panel :: barra(#{panel.seccion.aprovisionamiento}, #{panel.menu.proveedores})}"></header>

        <main class="canvas">

            <div class="alert alert-ok" th:if="${mensaje}" th:text="${mensaje}"></div>
            <div class="alert alert-err" th:if="${error}" th:text="${error}"></div>

            <div class="page-head">
                <div>
                    <h1 th:text="#{panel.menu.proveedores}">Proveedores</h1>
                </div>
                <div class="page-actions">
                    <a class="btn btn-primary" th:href="@{/compras/proveedores/nuevo}">
                        <svg th:replace="~{fragments/iconos :: plus}"></svg> <span th:text="#{proveedores.nuevo}">Nuevo proveedor</span></a>
                </div>
            </div>

            <!-- Los datos llegan enteros del servicio: aqui se calcula que trozo se pinta.
                 tam es el limite por pagina y pagina la que pide el controlador; si se pasa
                 del final, actual la recorta a la ultima que existe. -->
            <div class="card"
                 th:with="tam=${10},
                          total=${#lists.size(proveedores)},
                          paginas=${(total + tam - 1) / tam},
                          actual=${paginas == 0 ? 0 : (pagina > paginas - 1 ? paginas - 1 : pagina)},
                          inicio=${actual * tam},
                          fin=${actual * tam + tam > total ? total : actual * tam + tam}">

                <form class="filters" method="get" th:action="@{/compras/proveedores}">
                    <div class="fld">
                        <label th:text="#{comun.buscar}">Buscar</label>
                        <div class="search-inp">
                            <svg th:replace="~{fragments/iconos :: search}"></svg>
                            <input name="texto" th:value="${texto}" th:placeholder="#{proveedores.buscarPh}" placeholder="Nombre comercial o razón social">
                        </div>
                    </div>
                    <div class="fld">
                        <label th:text="#{comun.pais}">País</label>
                        <select class="inp" name="pais">
                            <option value="" th:text="#{comun.todos}">Todos</option>
                            <option th:each="p : ${paises}"
                                    th:value="${p}"
                                    th:text="${p}"
                                    th:selected="${pais != null and pais == p}">España</option>
                        </select>
                    </div>
                    <div class="fld">
                        <label th:text="#{comun.estado}">Estado</label>
                        <select class="inp" name="activo">
                            <option value="" th:text="#{comun.todos}">Todos</option>
                            <option value="true" th:selected="${activo != null and activo}" th:text="#{comun.activo}">Activo</option>
                            <option value="false" th:selected="${activo != null and !activo}" th:text="#{comun.inactivo}">Inactivo</option>
                        </select>
                    </div>
                    <div class="fld">
                        <label>&nbsp;</label>
                        <button type="submit" class="btn btn-primary" th:text="#{comun.filtrar}">Filtrar</button>
                    </div>
                    <div class="fld">
                        <label>&nbsp;</label>
                        <a class="btn" th:href="@{/compras/proveedores}" th:text="#{comun.limpiar}">Limpiar</a>
                    </div>
                </form>

                <div class="card-body tight">

                    <div class="empty" th:if="${#lists.isEmpty(proveedores)}">
                        <h4 th:text="#{proveedores.vacio}">Todavía no hay proveedores</h4>
                        <p class="hint" th:text="#{proveedores.vacio.hint}">Crea el primero.</p>
                    </div>

                    <div class="tbl-wrap" th:unless="${#lists.isEmpty(proveedores)}">
                        <table class="tbl">
                            <thead>
                            <tr>
                                <th th:text="#{proveedores.col.proveedor}">Proveedor</th>
                                <th th:text="#{proveedores.cif}">CIF</th>
                                <th th:text="#{comun.pais}">País</th>
                                <th th:text="#{proveedores.col.contacto}">Contacto</th>
                                <th class="num" th:text="#{proveedores.col.totalComprado}">Total comprado</th>
                                <th th:text="#{comun.estado}">Estado</th>
                                <th class="acts"></th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="p : ${proveedores.subList(inicio, fin)}">
                                <td>
                                    <div>
                                        <div class="t-main" th:text="${p.nombreComercial}">Nombre comercial</div>
                                        <div class="t-sub" th:text="${p.razonSocial}">Razón social</div>
                                    </div>
                                </td>
                                <td>
                                    <span class="enc" th:text="${p.cif}">B12345678</span>
                                    <span class="enc-tag">AES-256</span>
                                </td>
                                <td th:text="${p.pais}">España</td>
                                <td>
                                    <a th:href="'mailto:' + ${p.email}" th:text="${p.email}">correo@ejemplo.com</a>
                                </td>
                                <td class="num"><span class="muted" th:title="#{proveedores.pendienteSuma}">—</span></td>
                                <td>
                                    <span class="badge" th:classappend="${p.activo} ? 'b-good' : 'b-mute'"
                                          th:text="${p.activo} ? #{comun.activo} : #{comun.inactivo}">ACTIVO</span>
                                </td>
                                <td class="acts">
                                    <button type="button" class="btn btn-sm btn-ghost" title="Ver" th:title="#{comun.ver}" disabled>
                                        <svg th:replace="~{fragments/iconos :: eye}"></svg>
                                    </button>
                                    <a class="btn btn-sm btn-ghost" title="Editar" th:title="#{comun.editar}"
                                       th:href="@{/compras/proveedores/{id}/editar(id=${p.id})}">
                                        <svg th:replace="~{fragments/iconos :: edit}"></svg>
                                    </a>
                                    <form th:action="@{/compras/proveedores/{id}/eliminar(id=${p.id})}" method="post"
                                          th:data-confirmar="#{proveedores.confirmarEliminar}"
                                          onsubmit="return confirm(this.dataset.confirmar);">
                                        <button type="submit" class="btn btn-sm btn-danger" title="Eliminar"
                                                th:title="#{comun.eliminar}">
                                            <svg th:replace="~{fragments/iconos :: trash}"></svg>
                                        </button>
                                    </form>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- Flechas y numeros de pagina. Cada enlace repite los tres filtros para no
                     perderlos al cambiar de pagina, y .off apaga la flecha del extremo. -->
                <div class="pager" th:unless="${#lists.isEmpty(proveedores)}">
                    <span><span th:text="#{comun.mostrando}">Mostrando</span> <b th:text="${fin - inicio}">4</b>
                        <span th:text="#{comun.de}">de</span> <b th:text="${total}">4</b> <span th:text="#{comun.registros}">registros</span></span>
                    <div class="pages">
                        <a class="pg" th:classappend="${actual == 0} ? 'off' : ''"
                           th:href="@{/compras/proveedores(texto=${texto}, pais=${pais},
                                                           activo=${activo}, pagina=${actual - 1})}">&lsaquo;</a>
                        <a class="pg" th:each="i : ${#numbers.sequence(0, paginas - 1)}"
                           th:classappend="${i == actual} ? 'on' : ''"
                           th:text="${i + 1}"
                           th:href="@{/compras/proveedores(texto=${texto}, pais=${pais},
                                                           activo=${activo}, pagina=${i})}">1</a>
                        <a class="pg" th:classappend="${actual >= paginas - 1} ? 'off' : ''"
                           th:href="@{/compras/proveedores(texto=${texto}, pais=${pais},
                                                           activo=${activo}, pagina=${actual + 1})}">&rsaquo;</a>
                    </div>
                </div>

            </div>

        </main>
    </div>
</div>

</body>
</html>
