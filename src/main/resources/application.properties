spring.application.name=Proyecto1ERP
server.port = 8082
# ---------------------------------------------------------------------------
# Docker Compose
# ---------------------------------------------------------------------------
# Spring llegeix compose.yaml de la arrel, aixeca MySQL i MongoDB, espera que
# estiguin sanes i injecta l'URL, l'usuari i la contrasenya de totes dues. Per
# aixo aqui no hi ha ni spring.datasource.url ni spring.data.mongodb.uri.
spring.docker.compose.enabled=true
spring.docker.compose.file=compose.yaml
# start_only: els contenidors es queden engegats al tancar l'aplicacio. Aixi un
# reinici no fa esperar l'arrencada de les bases i no es perd la sessio de feina.
# Per aturar-les: docker compose stop
spring.docker.compose.lifecycle-management=start_only
spring.docker.compose.readiness.wait=always
spring.docker.compose.readiness.timeout=3m

# ---------------------------------------------------------------------------
# JPA / Hibernate
# ---------------------------------------------------------------------------
# validate: Hibernate NO toca l'esquema, nomes comprova que les entitats
# coincideixin amb les taules reals i es nega a arrencar si no quadren. Mentre no
# hi hagi cap @Entity no fa res. El dia que algu escrigui la primera entitat sense
# la migracio corresponent, l'aplicacio no arrencara: es volgut.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# ---------------------------------------------------------------------------
# Flyway
# ---------------------------------------------------------------------------
# Les migracions son fitxers versionats a src/main/resources/db/migration, amb
# nom V1__descripcio.sql. Flyway apunta a flyway_schema_history quines ha aplicat
# ja, de manera que despres d'un git pull cada membre rep nomes les que li falten.
# Encara no n'hi ha cap: ara mateix les bases queden buides.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ---------------------------------------------------------------------------
# Imatges pujades
# ---------------------------------------------------------------------------
app.uploads.dir=uploads
# ZIP de los juegos. Fuera de uploads a proposito: WebConfig sirve /uploads/** a todo el mundo
app.juegos.dir=juegos-privados
# El tope lo marca el ZIP de un juego y vale para cualquier formulario. Las imagenes siguen
# limitadas a 2 MB, pero ahora lo comprueba AlmacenArchivos en vez del multipart.
spring.servlet.multipart.max-file-size=1GB
# El limite de la peticion es el TOTAL, no el de cada archivo. El formulario de empleado
# manda la foto mas una docena de campos, asi que con los dos a 2MB una foto de 2MB justos
# se pasaba y reventaba antes de llegar al controlador.
spring.servlet.multipart.max-request-size=1100MB

# ---------------------------------------------------------------------------
# Registre
# ---------------------------------------------------------------------------
logging.level.org.flywaydb=INFO
logging.level.org.springframework.boot.docker.compose=INFO

# ---------------------------------------------------------------------------
# Correo (Mailpit, servidor de pruebas de Docker)
# ---------------------------------------------------------------------------
spring.mail.host=localhost
spring.mail.port=1025

# ---------------------------------------------------------------------------
# Perfil
# ---------------------------------------------------------------------------
spring.profiles.active=dev

#stripee
stripe.secret-key=${STRIPE_SECRET_KEY:}
app.url=http://localhost:8082