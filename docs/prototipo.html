<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LudusERP · Prototipo</title>
<style>
/* ===========================================================================
   LudusERP — prototipo de vistas
   Maqueta navegable sin logica de negocio: los datos son ficticios y las
   acciones no persisten nada. Un solo fichero, sin dependencias externas.
   =========================================================================== */
:root{
  --bg:#1c1c1c;
  --surface:#232326;
  --surface-2:#2a2a2e;
  --surface-3:#31313a;
  --line:rgba(255,255,255,.08);
  --line-strong:rgba(255,255,255,.15);
  --ink:#ededed;
  --ink-2:#b9b9c0;
  --muted:#8b8b93;
  --purple:#8b5cf6;
  --purple-light:#a78bfa;
  --purple-deep:#2e1065;
  --purple-dim:rgba(139,92,246,.14);
  --good:#56d364;
  --warn:#e3b341;
  --serious:#f0883e;
  --crit:#f85149;
  --info:#58a6ff;
  --r:10px;
  --r-sm:6px;
  --sidebar:252px;
  --topbar:58px;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.28);
  --font:"Segoe UI Variable Text","Segoe UI",Inter,system-ui,-apple-system,sans-serif;
  --mono:"Cascadia Mono",Consolas,"SF Mono",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--ink);
  font-family:var(--font);font-size:14px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
a{color:var(--purple-light);text-decoration:none}
a:hover{text-decoration:underline}
h1,h2,h3,h4{margin:0;font-weight:600;letter-spacing:-.01em}
button{font-family:inherit;font-size:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:inherit}
::selection{background:var(--purple);color:#fff}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#3a3a42;border-radius:6px;border:2px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:#4a4a55}

/* --- aviso de prototipo ---------------------------------------------------- */
.proto-flag{
  position:fixed;right:14px;bottom:14px;z-index:900;
  background:var(--purple-deep);border:1px solid var(--purple);
  color:var(--purple-light);font-size:11px;font-weight:600;
  padding:6px 11px;border-radius:99px;letter-spacing:.04em;text-transform:uppercase;
  box-shadow:var(--shadow);pointer-events:none;
}

/* ====================== ENVOLTORIO: PANEL ================================= */
.app{display:grid;grid-template-columns:var(--sidebar) 1fr;min-height:100vh}

.side{
  background:#1f1f23;border-right:1px solid var(--line);
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow:hidden;
}
.brand{
  display:flex;align-items:center;gap:10px;height:var(--topbar);
  padding:0 16px;border-bottom:1px solid var(--line);flex:0 0 auto;
}
.brand-mark{
  width:28px;height:28px;border-radius:7px;flex:0 0 auto;
  background:linear-gradient(145deg,var(--purple-light),var(--purple) 55%,#6d28d9);
  display:grid;place-items:center;color:#fff;font-weight:700;font-size:14px;
  box-shadow:0 0 0 1px rgba(255,255,255,.12) inset;
}
.brand-name{font-weight:650;font-size:15px;letter-spacing:-.02em}
.brand-name span{color:var(--purple-light)}
.side-scroll{overflow-y:auto;padding:10px 0 18px;flex:1 1 auto}
.nav-group{padding:12px 16px 4px;font-size:10.5px;font-weight:700;
  letter-spacing:.09em;text-transform:uppercase;color:#6e6e78}
.nav-item{
  display:flex;align-items:center;gap:10px;margin:1px 8px;padding:7px 9px;
  border-radius:var(--r-sm);color:var(--ink-2);font-size:13.5px;cursor:pointer;
  border:none;background:none;width:calc(100% - 16px);text-align:left;
}
.nav-item:hover{background:var(--surface-2);color:var(--ink)}
.nav-item.on{background:var(--purple-dim);color:#fff;font-weight:550;
  box-shadow:inset 0 0 0 1px rgba(139,92,246,.3)}
.nav-item.on .ic{color:var(--purple-light)}
.nav-item .ic{flex:0 0 auto;color:#7d7d88;display:grid;place-items:center}
.nav-item .tag{margin-left:auto;font-size:10px;font-weight:700;padding:1px 6px;
  border-radius:99px;background:var(--purple);color:#fff}
.side-foot{border-top:1px solid var(--line);padding:10px;flex:0 0 auto}

/* --- barra superior ------------------------------------------------------- */
.main{min-width:0;display:flex;flex-direction:column}
.top{
  height:var(--topbar);border-bottom:1px solid var(--line);background:rgba(28,28,28,.86);
  backdrop-filter:blur(8px);display:flex;align-items:center;gap:12px;padding:0 20px;
  position:sticky;top:0;z-index:50;
}
.crumb{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:7px}
.crumb b{color:var(--ink-2);font-weight:550}
.top-search{
  margin-left:auto;display:flex;align-items:center;gap:8px;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);
  padding:5px 10px;width:230px;color:var(--muted);
}
.top-search input{background:none;border:none;color:var(--ink);outline:none;width:100%;font-size:13px}
.icon-btn{
  width:32px;height:32px;border-radius:var(--r-sm);border:1px solid var(--line);
  background:var(--surface);color:var(--ink-2);display:grid;place-items:center;position:relative;
}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}
.dot{position:absolute;top:6px;right:6px;width:7px;height:7px;border-radius:50%;
  background:var(--purple-light);box-shadow:0 0 0 2px var(--surface)}
.lang{
  background:var(--surface);border:1px solid var(--line);color:var(--ink-2);
  border-radius:var(--r-sm);padding:6px 8px;outline:none;
}
.who{display:flex;align-items:center;gap:9px;padding-left:12px;border-left:1px solid var(--line)}
.avatar{
  width:30px;height:30px;border-radius:50%;display:grid;place-items:center;
  background:linear-gradient(145deg,#6d28d9,var(--purple));color:#fff;font-size:12px;font-weight:700;
}
.who-txt{line-height:1.25}
.who-txt b{display:block;font-size:12.5px;font-weight:600}
.who-txt span{font-size:11px;color:var(--muted)}

/* --- lienzo de pagina ----------------------------------------------------- */
.canvas{padding:22px 24px 60px;max-width:1500px;width:100%}
.page-head{display:flex;align-items:flex-start;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.page-head h1{font-size:21px}
.page-head p{margin:5px 0 0;color:var(--muted);font-size:13px;max-width:70ch}
.page-actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
</style>
<style>
/* ====================== COMPONENTES ======================================= */
/* --- botones -------------------------------------------------------------- */
.btn{
  display:inline-flex;align-items:center;gap:7px;border-radius:var(--r-sm);
  padding:7px 13px;font-size:13px;font-weight:550;border:1px solid var(--line-strong);
  background:var(--surface-2);color:var(--ink);white-space:nowrap;
}
.btn:hover{background:var(--surface-3);border-color:rgba(255,255,255,.22)}
.btn-primary{background:var(--purple);border-color:var(--purple);color:#fff}
.btn-primary:hover{background:var(--purple-light);border-color:var(--purple-light)}
.btn-ghost{background:transparent;border-color:transparent;color:var(--ink-2)}
.btn-ghost:hover{background:var(--surface-2);color:var(--ink)}
.btn-danger{color:#ffb4ae;border-color:rgba(248,81,73,.35);background:rgba(248,81,73,.1)}
.btn-danger:hover{background:rgba(248,81,73,.18)}
.btn-sm{padding:4px 9px;font-size:12px}
.btn[disabled]{opacity:.45;pointer-events:none}

/* --- tarjetas ------------------------------------------------------------- */
.card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  overflow:hidden;
}
.card-head{
  padding:13px 16px;border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:12px;
}
.card-head h3{font-size:14px}
.card-head .sub{font-size:12px;color:var(--muted)}
.card-head .right{margin-left:auto;display:flex;gap:8px;align-items:center}
.card-body{padding:16px}
.card-body.tight{padding:0}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-2-1{grid-template-columns:2fr 1fr}
.g-1-2{grid-template-columns:1fr 2fr}
@media(max-width:1100px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g3,.g-2-1,.g-1-2{grid-template-columns:1fr}
}

/* --- distintivos de estado (color + texto, nunca color solo) -------------- */
.badge{
  display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;
  padding:2px 8px;border-radius:99px;border:1px solid;white-space:nowrap;
  background:var(--surface-2);border-color:var(--line-strong);color:var(--ink-2);
}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;flex:0 0 auto}
.badge.b-good{color:var(--good);background:rgba(86,211,100,.1);border-color:rgba(86,211,100,.28)}
.badge.b-warn{color:var(--warn);background:rgba(227,179,65,.1);border-color:rgba(227,179,65,.28)}
.badge.b-serious{color:var(--serious);background:rgba(240,136,62,.1);border-color:rgba(240,136,62,.28)}
.badge.b-crit{color:var(--crit);background:rgba(248,81,73,.1);border-color:rgba(248,81,73,.3)}
.badge.b-info{color:var(--info);background:rgba(88,166,255,.1);border-color:rgba(88,166,255,.28)}
.badge.b-purple{color:var(--purple-light);background:var(--purple-dim);border-color:rgba(139,92,246,.32)}
.badge.b-mute{color:var(--muted)}
.chip{
  display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:3px 9px;
  border-radius:99px;background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2);
}
.chip.on{background:var(--purple-dim);border-color:rgba(139,92,246,.35);color:var(--purple-light)}
.chip .x{color:var(--muted);font-weight:700}

/* --- tablas --------------------------------------------------------------- */
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
table.tbl th{
  text-align:left;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  color:var(--muted);padding:9px 14px;border-bottom:1px solid var(--line);
  background:var(--surface-2);white-space:nowrap;
}
table.tbl td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
table.tbl tbody tr:hover{background:rgba(255,255,255,.025)}
table.tbl tbody tr:last-child td{border-bottom:none}
table.tbl td.num,table.tbl th.num{text-align:right;font-variant-numeric:tabular-nums}
table.tbl td.acts{text-align:right;white-space:nowrap}
.t-main{font-weight:550;color:var(--ink)}
.t-sub{font-size:11.5px;color:var(--muted)}
.mono{font-family:var(--mono);font-size:12.5px}
.enc{font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:.02em}
.enc-tag{font-size:10px;color:var(--purple-light);background:var(--purple-dim);
  padding:1px 5px;border-radius:99px;margin-left:5px;font-family:var(--font)}

/* --- filtros y paginacion ------------------------------------------------- */
.filters{
  display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;
  padding:12px 16px;border-bottom:1px solid var(--line);background:rgba(0,0,0,.14);
}
.fld{display:flex;flex-direction:column;gap:4px}
.fld>label{font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.inp{
  background:var(--surface-2);border:1px solid var(--line);color:var(--ink);
  border-radius:var(--r-sm);padding:6px 10px;outline:none;min-width:0;
}
.inp:focus{border-color:var(--purple);box-shadow:0 0 0 3px rgba(139,92,246,.18)}
.inp::placeholder{color:#6e6e78}
select.inp{appearance:none;padding-right:26px;
  background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),
    linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 14px) 52%,calc(100% - 9px) 52%;
  background-size:5px 5px,5px 5px;background-repeat:no-repeat}
textarea.inp{resize:vertical;min-height:84px;line-height:1.55}
.search-inp{display:flex;align-items:center;gap:7px;
  background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-sm);padding:6px 10px}
.search-inp input{background:none;border:none;outline:none;color:var(--ink);width:190px}
.search-inp svg{color:var(--muted);flex:0 0 auto}
.pager{
  display:flex;align-items:center;gap:10px;padding:11px 16px;border-top:1px solid var(--line);
  font-size:12.5px;color:var(--muted);
}
.pager .pages{margin-left:auto;display:flex;gap:4px}
.pg{min-width:28px;height:28px;border-radius:var(--r-sm);border:1px solid var(--line);
  background:var(--surface-2);color:var(--ink-2);display:grid;place-items:center;font-size:12.5px}
.pg.on{background:var(--purple);border-color:var(--purple);color:#fff;font-weight:600}
.pg:hover:not(.on){background:var(--surface-3)}

/* --- formularios ---------------------------------------------------------- */
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px 18px}
.form-grid .wide{grid-column:1/-1}
@media(max-width:800px){.form-grid{grid-template-columns:1fr}}
.frow{display:flex;flex-direction:column;gap:5px}
.frow>label{font-size:12.5px;font-weight:550;color:var(--ink-2)}
.frow>label .req{color:var(--purple-light);margin-left:2px}
.hint{font-size:11.5px;color:var(--muted)}
.hint.err{color:#ffb4ae}
.inp.bad{border-color:rgba(248,81,73,.55);box-shadow:0 0 0 3px rgba(248,81,73,.12)}
.sect-label{
  font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:var(--muted);margin:4px 0 2px;padding-bottom:7px;border-bottom:1px solid var(--line);
}
.switch{display:inline-flex;align-items:center;gap:9px;cursor:pointer;font-size:13px;color:var(--ink-2)}
.switch i{
  width:34px;height:19px;border-radius:99px;background:var(--surface-3);position:relative;
  border:1px solid var(--line-strong);transition:.15s;flex:0 0 auto;
}
.switch i::after{content:"";position:absolute;top:2px;left:2px;width:13px;height:13px;
  border-radius:50%;background:#8b8b93;transition:.15s}
.switch input{display:none}
.switch input:checked + i{background:var(--purple);border-color:var(--purple)}
.switch input:checked + i::after{left:17px;background:#fff}
.cbx{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2);cursor:pointer}
.cbx input{accent-color:var(--purple);width:15px;height:15px}
.form-foot{
  display:flex;gap:8px;justify-content:flex-end;align-items:center;
  padding:14px 16px;border-top:1px solid var(--line);background:rgba(0,0,0,.14);
}
.form-foot .note{margin-right:auto;font-size:12px;color:var(--muted)}

/* --- pestanas ------------------------------------------------------------- */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);padding:0 16px;background:var(--surface-2)}
.tab{
  padding:10px 13px;font-size:13px;color:var(--muted);border:none;background:none;
  border-bottom:2px solid transparent;margin-bottom:-1px;font-weight:550;
}
.tab:hover{color:var(--ink-2)}
.tab.on{color:#fff;border-bottom-color:var(--purple)}
.tab-pane{display:none}
.tab-pane.on{display:block}
</style>
<style>
/* ====================== PANEL / INDICADORES =============================== */
.kpi{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:14px 16px;display:flex;flex-direction:column;gap:3px;min-width:0;
}
.kpi .k-label{font-size:11.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.kpi .k-val{font-size:25px;font-weight:650;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.15}
.kpi .k-foot{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);margin-top:2px}
.kpi.accent{border-color:rgba(139,92,246,.3);background:
  linear-gradient(180deg,rgba(139,92,246,.09),transparent 60%),var(--surface)}
.kpi.accent .k-val{color:var(--purple-light)}

/* --- ranking horizontal -------------------------------------------------- */
.rank{display:flex;flex-direction:column;gap:9px}
.rank-row{display:grid;grid-template-columns:18px 1fr auto;gap:10px;align-items:center;font-size:13px}
.rank-row .n{color:var(--muted);font-size:11.5px;font-variant-numeric:tabular-nums;text-align:right}
.rank-bar{height:22px;background:var(--surface-2);border-radius:4px;overflow:hidden;position:relative}
.rank-bar i{position:absolute;inset:0 auto 0 0;background:var(--purple);border-radius:0 4px 4px 0;
  display:block;opacity:.85}
.rank-bar span{position:absolute;left:8px;top:0;height:100%;display:flex;align-items:center;
  font-size:12px;color:#fff;z-index:2;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.rank-row .v{font-variant-numeric:tabular-nums;color:var(--ink-2);font-size:12.5px}

/* --- listas de aviso / actividad ------------------------------------------ */
.feed{display:flex;flex-direction:column}
.feed-row{display:flex;gap:11px;padding:11px 16px;border-bottom:1px solid var(--line);align-items:flex-start}
.feed-row:last-child{border-bottom:none}
.feed-row .ic{width:28px;height:28px;border-radius:var(--r-sm);display:grid;place-items:center;
  background:var(--surface-2);color:var(--ink-2);flex:0 0 auto}
.feed-row .ic.p{background:var(--purple-dim);color:var(--purple-light)}
.feed-row .ic.w{background:rgba(227,179,65,.12);color:var(--warn)}
.feed-row .ic.c{background:rgba(248,81,73,.12);color:var(--crit)}
.feed-txt{min-width:0;flex:1 1 auto;font-size:13px}
.feed-txt .when{font-size:11.5px;color:var(--muted);margin-top:1px}
.empty{padding:38px 20px;text-align:center;color:var(--muted)}
.empty h4{font-size:14px;color:var(--ink-2);margin-bottom:5px}

/* ====================== ENVOLTORIO: TIENDA ================================ */
.shop{min-height:100vh;display:flex;flex-direction:column}
.shop-top{
  position:sticky;top:0;z-index:50;background:rgba(28,28,28,.92);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
}
.shop-bar{display:flex;align-items:center;gap:16px;padding:12px 26px;max-width:1360px;margin:0 auto;width:100%}
.shop-nav{display:flex;gap:4px;margin-left:10px}
.shop-nav a{padding:6px 11px;border-radius:var(--r-sm);color:var(--ink-2);font-size:13.5px;text-decoration:none}
.shop-nav a:hover{background:var(--surface-2);color:var(--ink);text-decoration:none}
.shop-search{
  margin-left:auto;display:flex;align-items:center;gap:8px;background:var(--surface);
  border:1px solid var(--line);border-radius:99px;padding:7px 14px;width:300px;
}
.shop-search input{background:none;border:none;outline:none;color:var(--ink);width:100%}
.cart-btn{position:relative}
.cart-n{
  position:absolute;top:-5px;right:-6px;background:var(--purple);color:#fff;font-size:10px;
  font-weight:700;min-width:17px;height:17px;border-radius:99px;display:grid;place-items:center;
  border:2px solid var(--bg);
}
.shop-body{max-width:1360px;margin:0 auto;width:100%;padding:24px 26px 70px}
.shop-foot{border-top:1px solid var(--line);color:var(--muted);font-size:12.5px;
  padding:20px 26px;text-align:center}

/* --- rejilla de catalogo -------------------------------------------------- */
.cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:18px}
.game{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  overflow:hidden;cursor:pointer;display:flex;flex-direction:column}
.game:hover{border-color:rgba(139,92,246,.45);transform:translateY(-2px);transition:.14s}
.cover{
  aspect-ratio:3/4;display:grid;place-items:center;padding:14px;text-align:center;
  font-weight:700;font-size:15px;letter-spacing:-.01em;color:#fff;position:relative;
  text-shadow:0 2px 10px rgba(0,0,0,.5);
}
.cover.wide{aspect-ratio:16/9}
.cover .pegi{
  position:absolute;top:8px;left:8px;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.3);
  font-size:10px;font-weight:700;padding:1px 5px;border-radius:4px;backdrop-filter:blur(3px);
}
.cover .off{
  position:absolute;top:8px;right:8px;background:var(--purple);font-size:10.5px;font-weight:700;
  padding:2px 6px;border-radius:4px;
}
.game-inf{padding:11px 12px;display:flex;flex-direction:column;gap:5px;flex:1 1 auto}
.game-inf .ttl{font-size:13.5px;font-weight:600;line-height:1.3}
.game-inf .meta{font-size:11.5px;color:var(--muted)}
.game-inf .foot{margin-top:auto;display:flex;align-items:center;gap:8px;padding-top:4px}
.price{font-weight:650;font-variant-numeric:tabular-nums}
.price .old{color:var(--muted);text-decoration:line-through;font-weight:400;font-size:12px;margin-right:5px}

/* --- ficha de juego ------------------------------------------------------- */
.gal{display:grid;grid-template-columns:1fr;gap:10px}
.gal-main{aspect-ratio:16/9;border-radius:var(--r);overflow:hidden}
.gal-thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.gal-thumbs .cover{aspect-ratio:16/9;font-size:11px;border-radius:var(--r-sm);cursor:pointer;opacity:.65}
.gal-thumbs .cover:hover,.gal-thumbs .cover.on{opacity:1;box-shadow:0 0 0 2px var(--purple)}
.buy-box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;
  display:flex;flex-direction:column;gap:12px;position:sticky;top:78px}
.buy-price{font-size:28px;font-weight:650;letter-spacing:-.02em}

/* --- pasos / cesta -------------------------------------------------------- */
.steps{display:flex;align-items:center;gap:0;margin-bottom:22px}
.step{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--muted)}
.step i{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:12px;
  font-weight:700;background:var(--surface-2);border:1px solid var(--line-strong);color:var(--muted)}
.step.on{color:var(--ink)}
.step.on i{background:var(--purple);border-color:var(--purple);color:#fff}
.step.done i{background:rgba(86,211,100,.14);border-color:rgba(86,211,100,.4);color:var(--good)}
.step-sep{flex:1 1 auto;height:1px;background:var(--line);margin:0 14px;min-width:24px}
.totals{display:flex;flex-direction:column;gap:9px;font-size:13.5px}
.totals .r{display:flex;justify-content:space-between;color:var(--ink-2)}
.totals .r.big{font-size:17px;font-weight:650;color:var(--ink);padding-top:10px;
  border-top:1px solid var(--line);margin-top:3px}
.totals .r span:last-child{font-variant-numeric:tabular-nums}

/* --- clave de licencia ---------------------------------------------------- */
.keybox{
  display:flex;align-items:center;gap:10px;background:#121214;border:1px dashed var(--line-strong);
  border-radius:var(--r-sm);padding:9px 12px;font-family:var(--mono);font-size:13px;
}
.keybox.hidden span{filter:blur(5px);user-select:none}
.keybox .k{letter-spacing:.06em;color:var(--purple-light)}

/* --- indicador en directo ------------------------------------------------ */
.live{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--good)}
.live i{width:7px;height:7px;border-radius:50%;background:var(--good);
  box-shadow:0 0 0 3px rgba(86,211,100,.18);animation:pulse 1.8s infinite}
@keyframes pulse{50%{opacity:.35}}

/* --- modal ---------------------------------------------------------------- */
.modal-bg{
  position:fixed;inset:0;background:rgba(0,0,0,.66);backdrop-filter:blur(3px);z-index:800;
  display:grid;place-items:center;padding:24px;
}
.modal{
  background:var(--surface);border:1px solid var(--line-strong);border-radius:12px;
  width:100%;max-width:520px;box-shadow:var(--shadow);max-height:86vh;display:flex;flex-direction:column;
}
.modal.lg{max-width:860px}
.modal-head{padding:15px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
.modal-head h3{font-size:15px}
.modal-body{padding:18px;overflow-y:auto}
.modal-foot{padding:13px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;
  background:rgba(0,0,0,.14)}

/* --- documento PDF simulado ----------------------------------------------- */
.doc{background:#fff;color:#1a1a1a;border-radius:4px;padding:34px 38px;font-size:12px;line-height:1.6;
  box-shadow:0 10px 40px rgba(0,0,0,.5)}
.doc h2{font-size:17px;color:#2e1065;margin-bottom:2px}
.doc .doc-head{display:flex;justify-content:space-between;align-items:flex-start;
  border-bottom:2px solid #2e1065;padding-bottom:12px;margin-bottom:16px}
.doc table{width:100%;border-collapse:collapse;margin:14px 0;font-size:11.5px}
.doc th{background:#f1ecfb;text-align:left;padding:7px 9px;border-bottom:1px solid #d9cdf2;color:#2e1065}
.doc td{padding:7px 9px;border-bottom:1px solid #eee}
.doc .tot{text-align:right}
.doc .muted{color:#777}

/* --- varios --------------------------------------------------------------- */
.row{display:flex;gap:10px;align-items:center}
.row.wrap{flex-wrap:wrap}
.spread{display:flex;gap:12px;align-items:center;justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:14px}
.sep{height:1px;background:var(--line);margin:4px 0}
.muted{color:var(--muted)}
.right{text-align:right}
.nowrap{white-space:nowrap}
.kv{display:grid;grid-template-columns:150px 1fr;gap:9px 14px;font-size:13px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;color:var(--ink)}
.note-box{
  background:var(--purple-dim);border:1px solid rgba(139,92,246,.28);border-radius:var(--r-sm);
  padding:11px 13px;font-size:12.5px;color:var(--ink-2);display:flex;gap:9px;align-items:flex-start;
}
.note-box svg{color:var(--purple-light);flex:0 0 auto;margin-top:1px}
.perm{font-family:var(--mono);font-size:12px;color:var(--ink-2)}
</style>

const I = (d, extra) => `<svg width="17" height="17" viewBox="0 0 24 24" fill="none"

const eur = n => n.toLocaleString("es-ES",{style:"currency",currency:"EUR"});
const num = n => n.toLocaleString("es-ES");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* Portada ficticia: degradado estable derivado del titulo, siempre dentro de
   la familia del morado para que el catalogo se lea como un solo sistema. */
function coverStyle(seed){
  let h = 0; for (const ch of seed) h = (h * 31 + ch.charCodeAt(0)) % 360;
  const a = 232 + (h % 68);           /* 232-300: azul-violeta  */
  const b = (a + 26 + (h % 22)) % 360;
  return `background:linear-gradient(145deg,hsl(${a} 52% 34%),hsl(${b} 46% 18%) 70%,#17171a)`;
}
function cover(title, cls, extra){
  return `<div class="cover ${cls||""}" style="${coverStyle(title)}">
    ${extra||""}<span>${esc(title)}</span></div>`;
}

  GRATIS:"b-info", DE_PAGO:"b-purple", SIN_CAMBIAR:"b-warn",
};
const badge = (txt, kind) => `<span class="badge ${kind || BADGE[txt] || ""}">${esc(String(txt).replace(/_/g," "))}</span>`;

/* Tabla generica. cols: [{t, cls}] ; rows: [[celda, ...]] */
function table(cols, rows, cls){
  return `<div class="tbl-wrap"><table class="tbl ${cls||""}">
    <thead><tr>${cols.map(c=>`<th class="${c.cls||""}">${c.t}</th>`).join("")}</tr></thead>
    <tbody>${rows.map(r=>`<tr>${r.map((c,i)=>
      `<td class="${(cols[i]||{}).cls||""}">${c}</td>`).join("")}</tr>`).join("")}</tbody>
  </table></div>`;
}
function pager(shown, total, pages, active){
  const p = [];
  for (let i=1;i<=pages;i++) p.push(`<button class="pg ${i===(active||1)?"on":""}">${i}</button>`);
  return `<div class="pager"><span>Mostrando <b>${shown}</b> de <b>${num(total)}</b> registros</span>
    <div class="pages"><button class="pg">&lsaquo;</button>${p.join("")}<button class="pg">&rsaquo;</button></div></div>`;
}
const acts = list => list.map(a =>

/* Ranking horizontal: magnitud en un solo tono, valor en texto neutro. */
function rankChart(rows){
  const max = Math.max(...rows.map(r=>r[1]));
  return `<div class="rank">${rows.map((r,i)=>`
    <div class="rank-row">
      <span class="n">${i+1}</span>
      <div class="rank-bar" title="${esc(r[0])}: ${r[1]} unidades">
        <i style="width:${(r[1]/max*100).toFixed(1)}%"></i><span>${esc(r[0])}</span>
      </div>
      <span class="v">${r[1]} ud · ${eur(r[2])}</span>
    </div>`).join("")}</div>`;
}

<script>
/* ===========================================================================
   9. ENRUTADO E INTERACCION
   =========================================================================== */
function bindTabs(){
  document.querySelectorAll("[data-tabs]").forEach(bar => {
    const card = bar.closest(".card") || document;
    bar.querySelectorAll(".tab").forEach(tab => {
      tab.addEventListener("click", () => {
        bar.querySelectorAll(".tab").forEach(t => t.classList.toggle("on", t === tab));
        card.querySelectorAll("[data-pane]").forEach(p =>
          p.classList.toggle("on", p.dataset.pane === tab.dataset.tab));
      });
    });
  });
}

/* Confirmacion de borrado: el patron se repite en todos los CRUD. */
function openModal(html){
  const d = document.createElement("div");
  d.className = "modal-bg";
  d.innerHTML = html;
  d.addEventListener("click", e => { if (e.target === d || e.target.dataset.close !== undefined) d.remove(); });
  document.body.appendChild(d);
}
document.addEventListener("click", e => {
  const b = e.target.closest('[title^="Borrar"], [title^="Quitar"], [title^="Anular"]');
  if (!b) return;
  e.preventDefault();
  openModal(`<div class="modal">
    <div class="modal-head"><h3>Confirmar la operacion</h3></div>
    <div class="modal-body stack">
      <p style="margin:0">Esta accion no se puede deshacer. Si el registro esta relacionado con
      otros &mdash;un videojuego con claves vendidas, un proveedor con ordenes&mdash; el validador
      de negocio la rechazara y solo permitira desactivarlo.</p>
      ${note("En el prototipo no se borra nada: el dialogo esta aqui para ensenar el patron.")}
    </div>
    <div class="modal-foot">
      <button class="btn" data-close>Cancelar</button>
      <button class="btn btn-danger" data-close>Si, borrar</button>
    </div>
  </div>`);
});

function render(){
  const key = decodeURIComponent(location.hash.replace(/^#\/?/, "")) || "login";
  const view = VIEWS[key];
  if (!view){ location.hash = "#/mapa"; return; }
  const html = view.shell === "shop" ? shellShop(view)
             : view.shell === "bare" ? shellBare(view)
             : shellPanel(view, key);
  document.getElementById("root").innerHTML = html;
  document.title = "LudusERP · " + (view.crumb ? view.crumb[view.crumb.length-1] : "Prototipo");
  window.scrollTo(0, 0);
  bindTabs();
}
window.addEventListener("hashchange", render);
render();
</script>
